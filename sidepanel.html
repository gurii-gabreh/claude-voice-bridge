<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Claude Voice Bridge</title>
<style>
  :root {
    --bg: #1c1b1a;
    --surface: #262422;
    --ink: #f2ede6;
    --ink-soft: #b8b0a6;
    --accent: #d97757;
    --listening: #2e7d32;
    --speaking: #1565c0;
    --error: #b3352a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    min-height: 100vh;
  }
  h1 { font-size: 15px; font-weight: 700; margin: 0; }
  .sub { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 0; }

  #radar-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    max-width: 100%;
  }
  #radar {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #mic-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 28px;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #mic-btn:hover { transform: translate(-50%, -50%) scale(1.05); }
  #mic-btn.listening { background: var(--listening); }
  #mic-btn.speaking { background: var(--speaking); }
  #mic-btn.error { background: var(--error); }

  #state-tag {
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: 700;
    color: var(--ink-soft);
    text-shadow: 0 0 6px currentColor;
  }
  #state-tag.listening { color: var(--listening); }
  #state-tag.speaking { color: var(--speaking); }
  #state-tag.error { color: var(--error); }

  #status {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    min-height: 18px;
  }

  #log {
    width: 100%;
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .log-item {
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .log-item.user { color: var(--accent); }
  .log-item.claude { color: var(--ink); }

  #phrases-section {
    width: 100%;
  }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  #phrase-buttons {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }
  .phrase-btn {
    text-align: left;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid #3a3733;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .phrase-btn:hover { border-color: var(--accent); }

  #phrase-editor {
    width: 100%;
    margin-top: 6px;
    padding: 6px;
    font-size: 11px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid #3a3733;
    border-radius: 4px;
    font-family: inherit;
    resize: vertical;
  }
  #phrase-save {
    margin-top: 6px;
    font-size: 11px;
    padding: 4px 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  details {
    width: 100%;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  summary { cursor: pointer; }
  input[type="text"] {
    width: 100%;
    margin-top: 6px;
    padding: 4px 6px;
    font-size: 11px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid #3a3733;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <h1>🎤 Claude Voice Bridge</h1>
  <p class="sub">マイクを押すと話しかけられます。話し終えると自動でclaude.aiへ送信・応答を読み上げます。</p>

  <div id="radar-wrap">
    <canvas id="radar" width="220" height="220"></canvas>
    <button id="mic-btn" title="クリックで音声会話モードの開始/停止">🎤</button>
  </div>
  <div id="state-tag">IDLE</div>
  <div id="status">停止中</div>

  <div id="log"></div>

  <div id="phrases-section">
    <div class="section-title">📌 定例文(押すと入力欄に反映、送信は自分で押す)</div>
    <div id="phrase-buttons"></div>
    <details>
      <summary>定例文を編集</summary>
      <p style="margin:6px 0;font-size:11px;color:var(--ink-soft)">
        1つのテンプレート = 1行目がボタンの名前、2行目以降が実際に入力欄へ反映される本文(複数行OK)。
        テンプレート同士は「---」だけの行で区切ってください。
      </p>
      <textarea id="phrase-editor" rows="10" placeholder="ボタン名1
本文1行目
本文2行目
---
ボタン名2
本文(長文もOK)"></textarea>
      <button id="phrase-save">保存</button>
    </details>
  </div>

  <details>
    <summary>手動セレクタ設定(自動検出がうまくいかない場合)</summary>
    <label>入力欄のCSSセレクタ</label>
    <input type="text" id="sel-input" placeholder="例: div[contenteditable=true]">
    <label>送信ボタンのCSSセレクタ</label>
    <input type="text" id="sel-send" placeholder="例: button[aria-label=Send]">
    <label>メッセージブロックのCSSセレクタ</label>
    <input type="text" id="sel-message" placeholder="例: [data-testid=message]">
  </details>

  <script src="sidepanel.js"></script>
</body>
</html>
