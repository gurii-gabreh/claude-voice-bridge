<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AI開発情報一覧タスク</title>
<link rel="stylesheet" href="widget-common.css">
<style>
  #tracker-table { display: none; }
  #tracker-table.has-items { display: table; }
</style>
</head>
<body>
  <select id="tracker-repo-filter" title="アプリ(リポジトリ)で絞り込み">
    <option value="">すべてのアプリ</option>
  </select>
  <table id="tracker-table">
    <thead>
      <tr><th>タスクID</th><th>内容</th><th>ルーム</th><th>ステータス</th><th></th></tr>
    </thead>
    <tbody id="tracker-tbody"></tbody>
  </table>
  <div id="tracker-empty" style="display:none;">未解決のタスクはありません。</div>
  <div id="widget-status"></div>

  <script src="tracker-store.js"></script>
  <script src="widget-common.js"></script>
  <script src="widget-tasks.js"></script>
</body>
</html>
